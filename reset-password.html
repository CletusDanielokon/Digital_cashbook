<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <title>Reset Password | CashBook</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: "#0f172a",
                        green: "#22c55e"
                    }
                }
            }
        };
    </script>
    <!-- Installable app (Add to Home screen) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#22c55e">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="pwa.js" defer></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

        <h1 class="text-2xl font-bold text-navy mb-1">Choose a new password</h1>
        <p class="text-sm text-slate-500 mb-6">Enter a new password for your CashBook account.</p>

        <p id="message" class="text-sm mb-4 font-semibold"></p>

        <form id="reset-form" class="space-y-4">

            <div>
                <label for="new-password" class="block text-sm font-medium text-slate-700 mb-1">New password</label>
                <input
                    type="password"
                    id="new-password"
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="At least 6 characters"
                    class="w-full border border-slate-300 rounded-lg px-4 py-3 outline-none focus:border-green"
                    required
                >
            </div>

            <div>
                <label for="confirm-password" class="block text-sm font-medium text-slate-700 mb-1">Confirm new password</label>
                <input
                    type="password"
                    id="confirm-password"
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="Repeat the password"
                    class="w-full border border-slate-300 rounded-lg px-4 py-3 outline-none focus:border-green"
                    required
                >
            </div>

            <button
                id="reset-submit"
                type="submit"
                class="w-full bg-green hover:bg-green-600 text-white py-3 rounded-lg font-semibold"
            >
                Update Password
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            <a href="index.html" class="text-green font-semibold hover:underline">Back to login</a>
        </p>

    </div>

    <script>
        const API_URL = "http://localhost:5000/api";

        const token = new URLSearchParams(window.location.search).get("token");
        const message = document.getElementById("message");
        const form = document.getElementById("reset-form");
        const submit = document.getElementById("reset-submit");

        function show(text, isError) {
            message.textContent = text;
            message.className = "text-sm mb-4 font-semibold " + (isError ? "text-red-500" : "text-green");
        }

        if (!token) {
            show("This reset link is incomplete. Please request a new one from the login page.", true);
            form.classList.add("hidden");
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const password = document.getElementById("new-password").value;
            const confirm = document.getElementById("confirm-password").value;

            if (password.length < 6) {
                show("Password must be at least 6 characters.", true);
                return;
            }

            if (password !== confirm) {
                show("The two passwords do not match.", true);
                return;
            }

            submit.disabled = true;
            submit.textContent = "Updating...";

            try {
                const response = await fetch(API_URL + "/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: token, password: password })
                });

                const data = await response.json();

                if (!response.ok) {
                    show(data.message || "Unable to reset password.", true);
                    submit.disabled = false;
                    submit.textContent = "Update Password";
                    return;
                }

                show(data.message + " Redirecting to login...", false);
                form.classList.add("hidden");

                setTimeout(function () {
                    window.location.href = "index.html";
                }, 2500);

            } catch (error) {
                console.error("Reset password error:", error);
                show("Unable to connect to the server.", true);
                submit.disabled = false;
                submit.textContent = "Update Password";
            }
        });
    </script>

</body>
</html>
